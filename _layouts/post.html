---
layout: default
---
<article class="article">
  <header class="article-header">
    <a class="back-link" href="{{ '/' | relative_url }}">← All writings</a>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% if page.categories.size > 0 %}<span class="meta-separator">·</span><span>{{ page.categories | join: ", " }}</span>{% endif %}
    </p>
    <h1>{{ page.title | escape }}</h1>
    {% if page.description %}<p class="article-description">{{ page.description | escape }}</p>{% endif %}
  </header>

  <div class="prose">
    {{ content }}
  </div>

  <footer class="article-footer">
    <div class="article-actions">
      <a class="text-link" href="{{ '/' | relative_url }}">← Back to the homepage</a>

      <button
        class="share-button"
        id="share-button"
        type="button"
        data-title="{{ page.title | escape }}"
        data-url="{{ page.url | absolute_url }}">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 16V3m0 0L7 8m5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>
        </svg>
        <span id="share-label">Share article</span>
      </button>
    </div>
  </footer>
</article>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const button = document.getElementById("share-button");
  const label = document.getElementById("share-label");

  if (!button || !label) return;

  button.addEventListener("click", async function () {
    const title = button.dataset.title;
    const url = button.dataset.url;

    if (navigator.share) {
      try {
        await navigator.share({
          title: title,
          text: "Read this article:",
          url: url
        });
      } catch (error) {
        if (error.name !== "AbortError") {
          console.error("Sharing failed:", error);
        }
      }
    } else {
      try {
        await navigator.clipboard.writeText(url);
        label.textContent = "Link copied!";
        button.classList.add("copied");

        setTimeout(function () {
          label.textContent = "Share article";
          button.classList.remove("copied");
        }, 2000);
      } catch (error) {
        label.textContent = "Unable to copy link";
      }
    }
  });
});
</script>
